<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>跑車收入紀錄</title>
<meta name="theme-color" content="#0e1519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="跑車紀錄">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* 夜間儀表板：深石板底、琥珀色主按鈕、大數字用窄體。單手操作，主要動作都在拇指範圍內。 */
:root{
  --bg:#0e1519;
  --surface:#162127;
  --surface-2:#1f2d35;
  --line:#2b3c46;
  --text:#e8eff2;
  --muted:#92a5ae;
  --accent:#f2b33d;
  --accent-ink:#1d1405;
  --good:#3fcf8e;
  --good-soft:#163a2c;
  --gold:#f2d25c;
  --low:#7d93a1;
  --bad:#ff6b5e;
  --bad-soft:#3d1c1a;
  --font-num:"Barlow Condensed","DIN Alternate","Roboto Condensed",system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 92px) max(16px, env(safe-area-inset-left))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px}
header.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--low)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--accent)}
main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:600}
.btn:active{transform:scale(.98)}
.btn.primary{width:100%;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:20px;min-height:68px;border-radius:16px;font-weight:800;letter-spacing:.06em}
.btn.primary[disabled]{opacity:.45}
.btn.good{width:100%;background:var(--good);color:#06291a;border-color:var(--good);font-size:20px;min-height:68px;border-radius:16px;font-weight:800}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#5a2c29}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{display:flex;flex-direction:column;gap:4px}
.status .label{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
.timer{font-family:var(--font-num);font-size:64px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface-2)}
.pill.max{background:var(--good-soft);color:var(--good);border-color:#24624a}
.pill.gold{background:#3b3315;color:var(--gold);border-color:#6a5a1c}
.pill.good{background:#1d3340;color:#8fd0f2;border-color:#2c5266}
.pill.normal{color:var(--text)}
.pill.low{color:var(--low)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:#6b2c27}
.slot{display:flex;flex-direction:column;gap:8px}
.slot .title{font-size:20px;font-weight:800;text-wrap:balance}
.slot ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.chip{white-space:nowrap;min-height:40px;padding:6px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.droponly{border-style:dashed;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.group-label{font-size:12px;color:var(--muted);margin:10px 0 6px;letter-spacing:.06em}
details.areas summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0;list-style:none}
details.areas summary::-webkit-details-marker{display:none}
details.areas summary::before{content:"＋ "}
details.areas[open] summary::before{content:"－ "}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--font-num);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.stat .k{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .v{font-family:var(--font-num);font-size:34px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--muted)}
.tile.hero{grid-column:1/-1}
.tile.hero .v{font-size:48px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.warn > i{background:var(--bad)}
.ledger{display:flex;flex-direction:column;gap:6px;font-size:15px}
.ledger .line{display:flex;justify-content:space-between;gap:10px}
.ledger .line.total{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:800}
.ledger .num{font-size:19px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);text-align:right;padding:6px 4px;font-size:12px}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td .bar{margin-top:4px}
.heat{display:grid;grid-template-columns:28px repeat(8,1fr);gap:3px;font-size:12px}
.heat .h{color:var(--muted);text-align:center;padding:2px 0}
.heat .d{color:var(--muted);display:flex;align-items:center}
.heat .c{border-radius:6px;min-height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .meta{font-size:13px;color:var(--muted)}
.x{min-width:44px;min-height:40px;border-radius:10px;color:var(--muted);border:1px solid var(--line);font-size:13px}
.x.armed{color:var(--bad);border-color:var(--bad)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;background:#2d2611;border:1px solid #6a5a1c;color:#f6e6b0;display:flex;flex-direction:column;gap:10px}
.banner.info{background:#16303d;border-color:#2c5266;color:#cfe9f7}
.banner.bad{background:var(--bad-soft);border-color:#6b2c27;color:#ffd0cb}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input[type=number],input[type=text],input[type=date],input[type=time]{font:inherit;font-size:20px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:52px}
input.big{font-family:var(--font-num);font-size:38px;font-weight:600}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(14,21,25,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);
  padding:6px max(10px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 6px) max(10px, env(safe-area-inset-left));z-index:5}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{min-height:52px;border-radius:12px;font-size:14px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--surface)}
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:560px;max-height:92%;overflow:auto;
  padding:18px max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 18px) max(16px, env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.sheet h3{margin:0;font-size:19px}
.hint{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.warnline{color:var(--bad);font-size:14px;font-weight:600}
textarea{width:100%;min-height:140px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
@media (max-width:380px){ .stats{grid-template-columns:repeat(2,1fr)} .timer{font-size:56px} }
@media (prefers-reduced-motion:reduce){ .btn:active{transform:none} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>跑車收入紀錄</h1>
    <div class="sync" id="sync"><span class="dot"></span><span>準備中…</span></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="分頁">
  <div class="inner">
    <button type="button" data-tab="drive" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M6 17l1.5-6h9L18 17M7 17v2M17 17v2"/><circle cx="8.5" cy="14" r=".8"/><circle cx="15.5" cy="14" r=".8"/></svg>跑車</button>
    <button type="button" data-tab="report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>報表</button>
    <button type="button" data-tab="cost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h7l3 3v13H7z"/><path d="M10 11h4M10 15h4"/></svg>支出</button>
    <button type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
  </div>
</nav>
<div id="sheet"></div>

<script src="geo.js"></script>
<script>
(function(){
"use strict";

/* ===== 固定資料 ===== */
const AREAS = [
  {g:"台北市", list:["中正區","大同區","中山區","松山區","大安區","萬華區","信義區","士林區","北投區","內湖區","南港區","文山區"]},
  {g:"新北市", list:["板橋區","三重區","新莊區","中和區","永和區","新店區","土城區","汐止區","蘆洲區","林口區","淡水區","新北其他"]},
  {g:"其他", list:["桃園市區","中壢","桃園其他","基隆","宜蘭","松山機場","桃園機場"]}
];
const DROP_ONLY = new Set(["松山機場","桃園機場"]);
const OUT_ZONE = "營業區外";
const COURSE = { takeRate:0.75, fuelPerHour:21, benchLow:410, benchHigh:530, safe:350 };
const CNY = [new Date(2027,1,6).getTime(), new Date(2028,0,26).getTime()];
const COST_KINDS = ["加油","停車","罰單","洗車","保養","其他"];
const DOW = ["一","二","三","四","五","六","日"];
const HOUR = 3600000, MIN = 60000, DAY = 86400000;

/* ===== 小工具 ===== */
const $ = (s, el) => (el||document).querySelector(s);
const pad = n => String(n).padStart(2,"0");
const dayKey = t => { const d = new Date(t); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Math.round(n||0).toLocaleString("zh-TW");
const dowOf = t => (new Date(t).getDay() + 6) % 7;
function fmtClock(ms){ ms = Math.max(0, ms); const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? h+":"+pad(m)+":"+pad(x) : pad(m)+":"+pad(x); }
function fmtHours(ms){ return (ms/HOUR).toFixed(1); }
function fmtDur(ms){ const m = Math.round(ms/MIN), h = Math.floor(m/60); if (h >= 24) return Math.floor(h/24)+" 天 "+(h%24)+" 小時"; return h ? h+" 小時 "+(m%60)+" 分" : m+" 分"; }
function hm(t){ const d = new Date(t); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function md(t){ const d = new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+"（"+DOW[dowOf(t)]+"）"; }
function startOfDay(t){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }

/* ===== 狀態 ===== */
const defaultCurrent = () => ({ status:"offline", shiftId:null, shiftDay:null, waitStart:null, waitArea:null, pending:null, breakStart:null, rainDate:null, holidayDate:null, recent:[] });
const defaultSettings = () => ({ takeRate:COURSE.takeRate, fuelPerHour:COURSE.fuelPerHour, autoLoc:true, fixed:{ kaohang:0, insurance:0, loan:0, phone:0, other:0 } });
const defaultMeta = () => ({ lastBackup:null, installDismissed:false, backupSnooze:null });
const S = {
  mode:"starting",          // local | memory
  ready:false,
  days:{}, current:defaultCurrent(), settings:defaultSettings(),
  tab:"drive", period:"week", demo:null, sheet:null,
  notice:null, migrate:null, armed:null, staleDismissed:false,
  costKind:"加油", costDraft:"", costDateDraft:"", meta:defaultMeta(), persisted:null, importText:""
};
let DB = null;

/* ===== 儲存：全部存在這支手機（localStorage），可以下載備份檔 ===== */
const LS_KEY = "paoche-v1";
function readLocal(){ try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } }
function writeLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({ days:S.days, current:S.current, settings:S.settings, meta:S.meta })); return true; } catch(e){ return false; } }
function persist(){
  if (writeLocal()){ if (S.mode !== "local"){ S.mode = "local"; renderSync(); } return; }
  if (S.mode !== "memory"){
    S.mode = "memory";
    S.notice = { kind:"bad", text:"這支手機現在沒辦法存檔（可能開了無痕模式或空間不足）。關掉頁面前，請先到「設定」下載備份檔。" };
  }
  renderSync();
}
function dayDoc(key){
  if (!S.days[key]) S.days[key] = { date:key, shifts:[], trips:[], idle:[], expenses:[] };
  const d = S.days[key];
  d.shifts = d.shifts || []; d.trips = d.trips || []; d.idle = d.idle || []; d.expenses = d.expenses || [];
  return d;
}
const saveDay = () => persist();
const saveCurrent = () => persist();
const saveSettings = () => persist();
function initStore(){
  const saved = readLocal();
  if (saved){
    S.days = saved.days || {};
    S.current = Object.assign(defaultCurrent(), saved.current || {});
    S.settings = Object.assign(defaultSettings(), saved.settings || {});
    S.settings.fixed = Object.assign(defaultSettings().fixed, (saved.settings || {}).fixed || {});
    S.meta = Object.assign(defaultMeta(), saved.meta || {});
  }
  persist();
  S.ready = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { S.persisted = ok; }, () => {}); } catch(e){}
  render();
}
function hasData(){ return Object.values(S.days).some(d => (d.trips||[]).length || (d.shifts||[]).length || (d.expenses||[]).length); }
function isStandalone(){ try { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; } catch(e){ return false; } }
function downloadFile(name, text, type){
  const blob = new Blob([text], { type }), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
function backupNow(){
  const now = Date.now();
  downloadFile("跑車紀錄備份-"+dayKey(now)+".json", JSON.stringify({ app:"paoche", version:1, exported:now, days:S.days, settings:S.settings }), "application/json");
  S.meta.lastBackup = now; persist();
  S.notice = { kind:"info", text:"備份檔已下載。iPhone 會放在「檔案」App 的「下載項目」，建議再上傳一份到 Google 雲端硬碟。" };
  render();
}
function mergeImport(obj){
  if (!obj || typeof obj !== "object" || !obj.days || typeof obj.days !== "object") throw new Error("bad");
  let added = 0;
  Object.keys(obj.days).forEach(k => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const from = obj.days[k] || {}, to = dayDoc(k);
    ["shifts","trips","idle","expenses"].forEach(f => {
      const key = x => x.id || (f+":"+x.start+":"+x.area);
      const ids = new Set(to[f].map(key));
      (Array.isArray(from[f]) ? from[f] : []).forEach(x => { if (x && typeof x === "object" && !ids.has(key(x))){ to[f].push(x); ids.add(key(x)); added++; } });
    });
  });
  if (obj.settings && typeof obj.settings === "object"){
    const fx = Object.assign({}, S.settings.fixed, obj.settings.fixed || {});
    S.settings = Object.assign(defaultSettings(), S.settings, obj.settings); S.settings.fixed = fx;
  }
  persist();
  return added;
}
function importText(text){
  try { const n = mergeImport(JSON.parse(text)); S.importText = ""; S.notice = { kind:"info", text:"還原完成，加進 "+n+" 筆紀錄（重複的會自動略過）。" }; }
  catch(e){ S.notice = { kind:"bad", text:"讀不懂這個備份檔，請確認是這個網站或 Claude 版跑車紀錄匯出的檔案。" }; }
  render();
}

/* ===== 定位：用 GPS 判斷在哪一區 ===== */
const GEO = { status:"idle", last:null, at:0 };
let geoAreas = null, geoLoading = null;
function loadGeo(){
  if (geoAreas) return Promise.resolve(geoAreas);
  if (!geoLoading) geoLoading = fetch("areas.json").then(r => r.ok ? r.json() : Promise.reject(new Error("http"))).then(j => (geoAreas = j)).catch(() => { geoLoading = null; return null; });
  return geoLoading;
}
function locateNow(){
  if (!S.settings.autoLoc) return Promise.resolve(null);
  if (!("geolocation" in navigator) || !window.PaoGeo){ GEO.status = "unsupported"; render(); return Promise.resolve(null); }
  GEO.status = "locating"; render();
  const pos = new Promise(res => {

  return Promise.all([loadGeo(), pos]).then(([areas, p]) => {
    if (!p || p.error){ GEO.status = p && p.error && p.error.code === 1 ? "denied" : "error"; render(); return null; }
    if (!areas){ GEO.status = "error"; render(); return null; }
    const lat = p.coords.latitude, lng = p.coords.longitude, r = window.PaoGeo.locate(areas, lat, lng);

    GEO.last = Object.assign({ lat:Math.round(lat*1000)/1000, lng:Math.round(lng*1000)/1000, acc:Math.round(p.coords.accuracy || 0) }, r);

/* ===== 時段建議（講義第 100 頁的規則） ===== */
function ctxToday(){ const k = dayKey(Date.now()); return { rain: S.current.rainDate === k, holiday: S.current.holidayDate === k }; }
function specialDay(t){
  const d = new Date(t), m = d.getMonth()+1, day = d.getDate(), h = d.getHours();
  if (m === 12 && day === 24) return "聖誕夜";
  if ((m === 12 && day === 31) || (m === 1 && day === 1 && h < 4)) return "跨年夜";
  if (m === 2 && day === 14) return "情人節";
  for (const c of CNY){ if (t >= c - 21*DAY && t < c) return "農曆春節前三週"; }
  return null;
}
function isGolden(t){ const d = new Date(t), h = d.getHours(); const eve = h < 1 ? (dowOf(t)+6)%7 : dowOf(t); return [2,4,5].includes(eve) && (h >= 17 || h < 1); }
function slotAdvice(t, ctx){
  const d = new Date(t), h = d.getHours(), dow = dowOf(t), month = d.getMonth()+1;
  const golden = isGolden(t), weekend = dow >= 5, special = specialDay(t);
  const evening = h >= 17 || h < 1;
  const noonLull = dow <= 4 && h >= 12 && h < 16;
  const winterNight = [12,1,2].includes(month) && (h >= 22 || h < 6);
  const notes = []; let level, title;
  if (ctx.rain){ level = "max"; title = "下雨天，全力跑"; if (noonLull) notes.push("平日中午本來是離峰，但下雨例外"); }
  else if (special){ level = "max"; title = special + "，全力跑"; }
  else if (weekend || ctx.holiday){ level = "max"; title = (ctx.holiday && !weekend ? "放假日" : "週末") + "，全力跑"; }
  else if (golden){ level = "gold"; title = "黃金時段"; }
  else if (noonLull){ level = "low"; title = "平日中午離峰，沒下雨可以休息"; }
  else if (evening){ level = "good"; title = "晚上時段"; notes.push("講義建議盡量開晚上，週三、五、六傍晚最好"); }
  else { level = "normal"; title = "一般時段"; }
  if (golden && level === "max") notes.push("也正好是黃金時段（週三、五、六 17:00–01:00）");
  if (winterNight) notes.push("冬天很冷的深夜（22:00–06:00）可以不跑");
  return { level, title, notes };
}
const LEVEL_LABEL = { max:"全力跑", gold:"黃金", good:"不錯", normal:"一般", low:"離峰" };
function nextGolden(now){
  if (isGolden(now)){ const d = new Date(now); if (d.getHours() >= 17) d.setDate(d.getDate()+1); d.setHours(1,0,0,0); return { inNow:true, end:d.getTime() }; }
  const d = new Date(now); d.setMinutes(0,0,0);
  for (let i = 0; i < 24*8; i++){ d.setHours(d.getHours()+1); const t = d.getTime(); if (d.getHours() === 17 && isGolden(t)) return { inNow:false, start:t }; }
  return null;
}

/* ===== 計算 ===== */
const useDemo = () => !!S.demo && S.tab === "report";
function allDays(){ return useDemo() ? S.demo.days : S.days; }
function curState(){ return useDemo() ? defaultCurrent() : S.current; }
function intervals(now){
  const out = [], cur = curState();
  Object.values(allDays()).forEach(day => (day.shifts||[]).forEach(sh => {
    let end = sh.end;
    if (!end){ if (cur.shiftId === sh.id && cur.status !== "offline") end = now; else return; }
    let segs = [[sh.start, end]];
    const brs = (sh.breaks||[]).map(b => [b.start, b.end || now]);
    if (cur.shiftId === sh.id && cur.status === "break" && cur.breakStart) brs.push([cur.breakStart, now]);
    brs.forEach(([bs,be]) => { const n = []; segs.forEach(([s,e]) => { if (be <= s || bs >= e) n.push([s,e]); else { if (bs > s) n.push([s,bs]); if (be < e) n.push([be,e]); } }); segs = n; });
    segs.forEach(([s,e]) => { if (e > s) out.push({ s, e }); });
  }));
  return out.sort((a,b) => a.s - b.s);
}
function trips(){ const out = []; Object.values(allDays()).forEach(d => (d.trips||[]).forEach(t => out.push(t))); return out.sort((a,b) => a.accepted - b.accepted); }
function idles(){ const out = []; Object.values(allDays()).forEach(d => (d.idle||[]).forEach(t => out.push(t))); return out; }
function expenses(){ const out = []; Object.values(allDays()).forEach(d => (d.expenses||[]).forEach(t => out.push(t))); return out.sort((a,b) => b.ts - a.ts); }
const tripTotal = t => (Number(t.fare)||0) + (Number(t.tip)||0);
function periodStart(p, now){
  if (p === "today") return startOfDay(now);
  if (p === "week"){ const s = startOfDay(now); return s - dowOf(now)*DAY; }
  if (p === "month"){ const d = new Date(now); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
  let first = now;
  intervals(now).forEach(i => { if (i.s < first) first = i.s; });
  expenses().forEach(e => { if (e.ts < first) first = e.ts; });
  return startOfDay(first);
}
function summary(p, now){
  const from = periodStart(p, now);
  let online = 0; intervals(now).forEach(i => { const s = Math.max(i.s, from), e = Math.min(i.e, now); if (e > s) online += e - s; });
  const ts = trips().filter(t => t.accepted >= from && t.accepted <= now);
  const fare = ts.reduce((a,t) => a + tripTotal(t), 0);
  const ex = expenses().filter(e => e.ts >= from && e.ts <= now);
  const fuelActual = ex.filter(e => e.kind === "加油").reduce((a,e) => a + (Number(e.amount)||0), 0);
  const other = ex.filter(e => e.kind !== "加油").reduce((a,e) => a + (Number(e.amount)||0), 0);
  const fuelEst = online/HOUR * (Number(S.settings.fuelPerHour)||0);
  const fuel = fuelActual > 0 ? fuelActual : fuelEst;
  const f = S.settings.fixed || {};
  const monthlyFixed = ["kaohang","insurance","loan","phone","other"].reduce((a,k) => a + (Number(f[k])||0), 0);
  const days = Math.max(1, Math.ceil((now - from) / DAY));
  const fixed = monthlyFixed * days / 30;
  const net = fare - fuel - other - fixed;
  const hrs = online / HOUR;
  return { from, online, hrs, trips:ts.length, fare, fuelActual, fuelEst, fuel, fuelIsActual: fuelActual > 0, other, fixed, monthlyFixed, days, net,
    grossPerHour: hrs > 0 ? fare/hrs : 0, netPerHour: hrs > 0 ? net/hrs : 0 };
}
function areaStats(from, now){
  const m = {};
  const get = a => m[a] || (m[a] = { area:a, trips:0, wait:0, ride:0, fare:0 });
  trips().filter(t => t.accepted >= from && t.accepted <= now).forEach(t => {
    const a = get(t.area || "未選區域"); a.trips++; a.wait += Math.max(0, t.accepted - t.waitStart); a.ride += Math.max(0, (t.ended||t.accepted) - t.accepted); a.fare += tripTotal(t);
  });
  idles().filter(i => i.start >= from && i.start <= now).forEach(i => { const a = get(i.area || "未選區域"); a.wait += Math.max(0, i.end - i.start); });
  return Object.values(m).map(a => Object.assign(a, { perHour: (a.wait + a.ride) > 0 ? a.fare / ((a.wait + a.ride)/HOUR) : 0, avgWait: a.trips ? a.wait / a.trips : null }))
    .sort((x,y) => (y.trips ? y.perHour : -1) - (x.trips ? x.perHour : -1));
}
function heat(from, now){
  const on = Array.from({length:7}, () => Array(8).fill(0)), fare = Array.from({length:7}, () => Array(8).fill(0));
  intervals(now).forEach(i => {
    let t = Math.max(i.s, from); const e = Math.min(i.e, now);
    while (t < e){ const d = new Date(t); const nh = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours()+1).getTime(); const seg = Math.min(nh, e) - t; on[dowOf(t)][Math.floor(d.getHours()/3)] += seg; t += seg; }
  });
  trips().filter(t => t.accepted >= from && t.accepted <= now).forEach(t => { fare[dowOf(t.accepted)][Math.floor(new Date(t.accepted).getHours()/3)] += tripTotal(t); });
  return on.map((row,r) => row.map((ms,c) => ms >= 20*MIN ? fare[r][c] / (ms/HOUR) : null));
}
function rollingOnline(now){
  const iv = intervals(now); let total = 0, cursor = now;
  for (let i = iv.length - 1; i >= 0; i--){ const it = iv[i]; if (cursor - Math.min(it.e, now) >= 6*HOUR) break; total += Math.min(it.e, now) - it.s; cursor = it.s; }
  return total;
}
function slotHistory(now){
  const h = heat(periodStart("all", now), now); const r = dowOf(now), c = Math.floor(new Date(now).getHours()/3);
  return h[r][c];
}

function touchRecent(a){ if (!a) return; const r = (S.current.recent||[]).filter(x => x !== a); r.unshift(a); S.current.recent = r.slice(0,6); }
function closeIdle(now){
  const c = S.current; if (!c.waitStart || !c.shiftDay) return;
  if (now - c.waitStart >= MIN){ dayDoc(c.shiftDay).idle.push({ area:c.waitArea, start:c.waitStart, end:now }); }
}
const act = {
  start(){
    const now = Date.now(), key = dayKey(now), id = uid();
    dayDoc(key).shifts.push({ id, start:now, end:null, breaks:[] });
    Object.assign(S.current, { status:"waiting", shiftId:id, shiftDay:key, waitStart:now, waitArea:(S.current.recent||[])[0] || null, pending:null, breakStart:null });
    saveDay(key); saveCurrent(); render();
    autoArea();
  },
  area(a){
    const c = S.current, now = Date.now();
    if (c.status === "waiting" && c.waitArea && c.waitArea !== a){ closeIdle(now); c.waitStart = now; saveDay(c.shiftDay); }
    c.waitArea = a; touchRecent(a); saveCurrent(); render();
  },
  accept(){
    const c = S.current, now = Date.now();
    c.pending = { area:c.waitArea, waitStart:c.waitStart || now, accepted:now };
    c.status = "ontrip"; saveCurrent(); render();
    locateNow().then(r => {
      const p = S.current.pending;
      if (r && S.current.status === "ontrip" && p && p.accepted === now){ p.area = r.area; p.loc = { lat:r.lat, lng:r.lng }; touchRecent(r.area); saveCurrent(); }
      render();
    });
  },
  cancelTrip(){
    const c = S.current; c.status = "waiting"; c.waitStart = c.pending ? c.pending.waitStart : Date.now(); c.pending = null; saveCurrent(); render();
  },
  complete(v){
    const c = S.current, now = Date.now(), p = c.pending || { area:c.waitArea, waitStart:now, accepted:now };
    dayDoc(c.shiftDay || dayKey(now)).trips.push({ id:uid(), shiftId:c.shiftId, area:p.area, waitStart:p.waitStart, accepted:p.accepted, ended:now, fare:v.fare, tip:v.tip, surge:v.surge, drop:v.drop, pickLoc:p.loc || null, dropLoc:v.dropLoc || null });
    touchRecent(v.drop);
    Object.assign(c, { status:"waiting", pending:null, waitStart:now, waitArea:v.drop || p.area });
    saveDay(c.shiftDay || dayKey(now)); saveCurrent(); S.sheet = null; render();
  },
  pause(){
    const c = S.current, now = Date.now(); closeIdle(now);
    c.status = "break"; c.breakStart = now; c.waitStart = null; saveDay(c.shiftDay); saveCurrent(); render();
  },
  resume(){
    const c = S.current, now = Date.now(), sh = findShift(c.shiftId);
    if (sh && c.breakStart){ sh.breaks = sh.breaks || []; sh.breaks.push({ start:c.breakStart, end:now }); saveDay(c.shiftDay); }
    Object.assign(c, { status:"waiting", breakStart:null, waitStart:now }); saveCurrent(); render();
  },
  end(at){
    const c = S.current, now = at || Date.now(), sh = findShift(c.shiftId);
    if (c.status === "waiting") closeIdle(now);
    if (sh){ if (c.status === "break" && c.breakStart){ sh.breaks = sh.breaks || []; sh.breaks.push({ start:c.breakStart, end:Math.max(c.breakStart, now) }); } sh.end = now; saveDay(c.shiftDay); }
    Object.assign(c, { status:"offline", shiftId:null, shiftDay:null, waitStart:null, pending:null, breakStart:null });
    saveCurrent(); S.sheet = null; render();
  },
  toggleCtx(which){
    const k = dayKey(Date.now()), f = which === "rain" ? "rainDate" : "holidayDate";
    S.current[f] = S.current[f] === k ? null : k; saveCurrent(); render();
  },
  addCost(kind, amount, date){
    const [y,mo,d] = date.split("-").map(Number); const ts = new Date(y, mo-1, d, 12).getTime(); const key = dayKey(ts);
    dayDoc(key).expenses.push({ id:uid(), ts, kind, amount });
    saveDay(key); S.notice = { kind:"info", text:"已記下 "+kind+" "+money(amount) }; render();
  },
  remove(kind, id){
    for (const k of Object.keys(S.days)){
      const d = S.days[k], arr = d[kind] || [], i = arr.findIndex(x => x.id === id);
      if (i >= 0){ arr.splice(i,1); saveDay(k); break; }
    }
    S.armed = null; render();
  }
};

function makeDemo(){

  const prof = { "信義區":[6,1.25], "大安區":[7,1.1], "中山區":[6,1.05], "松山區":[8,1.0], "內湖區":[11,1.05], "中正區":[7,0.95], "板橋區":[10,0.9], "新莊區":[13,0.85], "南港區":[12,1.0], "萬華區":[9,0.9] };

  const today = startOfDay(Date.now());
  for (let i = 7; i >= 1; i--){
    const base = today - i*DAY, dw = dowOf(base), key = dayKey(base);
    const startH = dw >= 5 ? 11 : (dw === 2 || dw === 4 ? 15 : 14), len = (10.5 + rnd()*2) * HOUR;
    const start = base + startH*HOUR, end = start + len, sid = "d"+i;
    const d = days[key] = { date:key, shifts:[{ id:sid, start, end, breaks:[{ start:start+4*HOUR, end:start+4.5*HOUR }] }], trips:[], idle:[], expenses:[] };
    let t = start, area = names[Math.floor(rnd()*names.length)];
    while (t < end - 15*MIN){
      if (t >= start+4*HOUR && t < start+4.5*HOUR){ t = start+4.5*HOUR; continue; }
      const [w, f] = prof[area]; const wait = (w*0.5 + rnd()*w) * MIN;
      if (rnd() < 0.12){ d.idle.push({ area, start:t, end:t+wait }); t += wait; area = names[Math.floor(rnd()*names.length)]; continue; }
      const acc = t + wait, dur = (8 + rnd()*26) * MIN, h = new Date(acc).getHours();
      const boost = (h >= 17 || h < 1) && [2,4,5].includes(dw) ? 1.15 : 1;
      const surge = rnd() < 0.1;
      let fare = (55 + dur/MIN*6.4 + rnd()*40) * f * boost * (surge ? 1.3 : 1);
      const drop = rnd() < 0.6 ? area : names[Math.floor(rnd()*names.length)];
      d.trips.push({ id:"t"+i+"-"+d.trips.length, shiftId:sid, area, waitStart:t, accepted:acc, ended:acc+dur, fare:Math.round(fare), tip:rnd() < 0.05 ? 50 : 0, surge, drop });
      t = acc + dur; area = drop;
    }
    if (i % 3 === 0) d.expenses.push({ id:"e"+i, ts:base+12*HOUR, kind:"加油", amount:800 + Math.round(rnd()*80) });
  }
  return { days };
}

/* ===== 事件 ===== */
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("nav.tabs button");
  if (tabBtn){ S.tab = tabBtn.dataset.tab; S.armed = null; render(); window.scrollTo(0,0); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "closeSheet" && e.target !== el) return; // 只在點背景或按鈕時關閉
  switch(a){
    case "dismiss": S.notice = null; render(); break;
    case "dismissInstall": S.meta.installDismissed = true; persist(); render(); break;
    case "snoozeBackup": S.meta.backupSnooze = Date.now(); persist(); render(); break;
    case "backup": backupNow(); break;
    case "dlCsv": downloadFile("跑車每趟明細-"+dayKey(Date.now())+".csv", "\ufeff"+toCsv(), "text/csv;charset=utf-8"); break;
    case "importPaste": { const t = ($("#importBox")||{}).value || ""; if (t.trim()) importText(t.trim()); break; }
    case "relocate": autoArea(); break;
    case "autoLoc": S.settings.autoLoc = !S.settings.autoLoc; GEO.status = "idle"; saveSettings(); render(); break;
    case "start": if (S.ready) act.start(); break;
    case "area": act.area(el.dataset.area); break;
    case "accept": act.accept(); break;
    case "cancelTrip": act.cancelTrip(); break;
    case "openComplete": {
      S.sheet = { kind:"complete", surge:false }; render();
      const sheetRef = S.sheet;
      locateNow().then(r => { if (r && S.sheet === sheetRef && !sheetRef.dropPicked){ readSheet(); sheetRef.drop = r.area; sheetRef.dropLoc = { lat:r.lat, lng:r.lng }; sheetRef.dropAuto = true; sheetRef.focus = false; } render(); });
      break; }
    case "drop": readSheet(); S.sheet.drop = el.dataset.area; S.sheet.dropPicked = true; S.sheet.dropLoc = null; S.sheet.focus = false; render(); break;
    case "surge": readSheet(); S.sheet.surge = !S.sheet.surge; S.sheet.focus = false; render(); break;
    case "saveTrip": {
      readSheet(); const fare = Number(S.sheet.fare), tip = Number(S.sheet.tip) || 0;
      if (!(fare > 0)){ const er = $("#sheetErr"); if (er) er.textContent = "請填這趟的實拿金額。"; $("#fare") && $("#fare").focus(); break; }
      const p = S.current.pending || {};
      act.complete({ fare:Math.round(fare), tip:Math.round(tip), surge:!!S.sheet.surge, drop:S.sheet.drop !== undefined ? S.sheet.drop : (p.area || S.current.waitArea), dropLoc:S.sheet.dropLoc || null });
      break; }
    case "pause": act.pause(); break;
    case "resume": act.resume(); break;
    case "askEnd": S.sheet = { kind:"end" }; render(); break;
    case "end": act.end(); break;
    case "endAt": act.end(Number(el.dataset.at)); break;
    case "staleOk": S.staleDismissed = true; render(); break;
    case "closeSheet": S.sheet = null; render(); break;
    case "ctx": act.toggleCtx(el.dataset.which); break;
    case "period": S.period = el.dataset.p; render(); break;
    case "demoOn": S.demo = makeDemo(); S.period = "all"; render(); break;
    case "demoOff": S.demo = null; render(); break;
    case "costKind": S.costKind = el.dataset.k; render(); break;
    case "addCost": {
      const amt = Number(($("#costAmt")||{}).value), date = ($("#costDate")||{}).value || dayKey(Date.now());
      if (!(amt > 0)){ S.notice = { kind:"warn", text:"請填支出金額。" }; render(); break; }
      S.costDraft = ""; S.costDateDraft = ""; act.addCost(S.costKind, Math.round(amt), date); break; }
    case "del": {
      const key = el.dataset.kind+":"+el.dataset.id;
      if (S.armed === key) act.remove(el.dataset.kind, el.dataset.id);
      else { S.armed = key; render(); setTimeout(() => { if (S.armed === key){ S.armed = null; render(); } }, 3000); }
      break; }
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "costAmt") S.costDraft = el.value;
  else if (el.id === "costDate") S.costDateDraft = el.value;
  else if (S.sheet && (el.id === "fare" || el.id === "tip")) S.sheet[el.id] = el.value;
  else if (el.id === "importBox") S.importText = el.value;
});
function readSheet(){ if (!S.sheet) return; const f = $("#fare"), t = $("#tip"); if (f) S.sheet.fare = f.value; if (t) S.sheet.tip = t.value; }
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "restoreFile" && el.files && el.files[0]){
    const fr = new FileReader();
    fr.onload = () => importText(String(fr.result || ""));
    fr.onerror = () => { S.notice = { kind:"bad", text:"讀不到這個檔案，請再選一次。" }; render(); };
    fr.readAsText(el.files[0]); el.value = ""; return;
  }
  if (el.dataset.set){
    const v = Number(el.value);
    if (el.dataset.set === "takeRate"){ if (v > 0 && v <= 100) S.settings.takeRate = v/100; }
    else if (v >= 0) S.settings[el.dataset.set] = v;
    saveSettings(); render();
  } else if (el.dataset.fixed){
    const v = Number(el.value); if (v >= 0){ S.settings.fixed = Object.assign({}, S.settings.fixed, { [el.dataset.fixed]: Math.round(v) }); saveSettings(); render(); }
  }
});
function toCsv(){
  const rows = [["日期","星期","接單時間","區域","下車區域","等單分鐘","載客分鐘","實拿","小費","加成","上車緯度","上車經度","下車緯度","下車經度"]];
  trips().forEach(t => rows.push([dayKey(t.accepted), DOW[dowOf(t.accepted)], hm(t.accepted), t.area||"", t.drop||"", Math.round((t.accepted-t.waitStart)/MIN), Math.round(((t.ended||t.accepted)-t.accepted)/MIN), t.fare, t.tip||0, t.surge ? "是" : "", t.pickLoc ? t.pickLoc.lat : "", t.pickLoc ? t.pickLoc.lng : "", t.dropLoc ? t.dropLoc.lat : "", t.dropLoc ? t.dropLoc.lng : ""]));
  return rows.map(r => r.join(",")).join("\n");
}

render();
setInterval(tick, 1000);
setInterval(() => { if (!S.sheet && !(document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA"))) render(); }, 60000);
// 等單時每 4 分鐘自動重新定位一次（畫面開著才會跑）
setInterval(() => { if (S.current.status === "waiting" && S.settings.autoLoc && document.visibilityState === "visible" && GEO.status !== "locating" && GEO.status !== "denied") autoArea(); }, 4*MIN);
initStore();
if (S.current.status === "waiting") autoArea();
if ("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
